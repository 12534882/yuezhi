# 粤职通 · 云端自动采集+发布 v4 —— GitHub Pages 通道（Netlify 额度耗尽后迁移）
# 每日 08:00 / 18:00 (北京时间=UTC 00:00/10:00)：
#   1) 合并本机 push 的国聘 sidecar 进主库
#   2) 全部源采集(含国聘-Playwright浏览器) → 治理 → 拆职位表 → 重建
#   3) publish_pages：更新 gh-pages 分支 → GitHub Pages 自动发布（免费无限）
# 注意：不再 push main 触发 Netlify（Netlify 免费构建额度已耗尽）
name: yuezhi-auto

on:
  schedule:
    - cron: '0 0 * * *'   # 08:00 北京时间
    - cron: '0 10 * * *'  # 18:00 北京时间
  workflow_dispatch: {}   # 手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install --no-save xlsx 2>/dev/null || true
          npm install --no-save playwright 2>/dev/null || true

      - name: Install chromium (for 国聘)
        run: npx playwright install --with-deps chromium 2>/dev/null || true

      - name: Merge 本机国聘 sidecar 进主库
        run: node engine/merge_sidecar.js || true

      - name: Run all collectors
        run: node collector/index.js || true

      - name: Enrich batch (报名时间/状态/A级)
        run: node engine/enrich_batch.js --incremental || true

      - name: Build standalone
        run: node engine/build_standalone.js

      - name: Update main branch (job_db+dist 备份)
        run: |
          git config user.name "yuezhi-bot"
          git config user.email "yuezhi-bot@users.noreply.github.com"
          git add data/job_db.json dist/index.html
          git diff --cached --quiet || git commit -m "yuezhi auto: $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        run: |
          git fetch origin gh-pages
          git checkout -f gh-pages
          cp dist/index.html index.html
          git add index.html
          git diff --cached --quiet || git commit -m "deploy pages: $(date '+%Y-%m-%d %H:%M')"
          git push origin gh-pages
          git checkout -f main || git checkout -f master || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}