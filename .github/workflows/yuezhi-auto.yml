# 粤职通 · 云端自动采集+发布（GitHub Actions 免费定时）
# 每日 08:00 / 18:00 (北京时间=UTC 00:00/10:00) 执行：
#   采集纯fetch源(公务员/事业编/南网/铁路/公告轮询) → 治理 → 拆职位表 → 重建 → push
# push 自动触发 Netlify 部署 → 永久网址实时更新
# 需浏览器源(国聘等)仍由本机守护运行补充，两边合流。
name: yuezhi-auto

on:
  schedule:
    - cron: '0 0 * * *'   # 08:00 北京时间
    - cron: '0 10 * * *'  # 18:00 北京时间
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-save xlsx 2>/dev/null || true

      - name: Run collectors (fetch-only sources)
        run: node collector/index.js announce_watch gov csg grci gdzp curated_sources

      - name: Enrich batch (报名时间/状态/A级)
        run: node engine/enrich_batch.js --incremental || true

      - name: Build standalone
        run: node engine/build_standalone.js

      - name: Commit and push dist
        run: |
          git config user.name "yuezhi-bot"
          git config user.email "yuezhi-bot@users.noreply.github.com"
          git add dist data/job_db.json
          git diff --cached --quiet || git commit -m "yuezhi auto: $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}