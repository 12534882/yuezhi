# 粤职通 · 云端自动采集+发布（GitHub Actions 免费定时）v2
# 每日 08:00 / 18:00 (北京时间=UTC 00:00/10:00)：
#   全部源采集(含国聘-Playwright浏览器) → 治理 → 拆职位表 → 重建 → push
# push 自动触发 Netlify 部署 → 永久网址实时更新
# 本机守护可停，或仅作为浏览器源备份。job_db 由 git 单源同步，避免双写冲突：云端是唯一写者。
name: yuezhi-auto

on:
  schedule:
    - cron: '0 0 * * *'   # 08:00 北京时间
    - cron: '0 10 * * *'  # 18:00 北京时间
  workflow_dispatch: {}   # 手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install --no-save xlsx 2>/dev/null || true
          npm install --no-save playwright 2>/dev/null || true

      - name: Install chromium (for 国聘)
        run: npx playwright install --with-deps chromium 2>/dev/null || true

      - name: Run all collectors
        run: node collector/index.js || true

      - name: Enrich batch (报名时间/状态/A级)
        run: node engine/enrich_batch.js --incremental || true

      - name: Build standalone
        run: node engine/build_standalone.js

      - name: Commit and push
        run: |
          git config user.name "yuezhi-bot"
          git config user.email "yuezhi-bot@users.noreply.github.com"
          git add dist data/job_db.json
          git diff --cached --quiet || git commit -m "yuezhi auto: $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}